name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rojo
        uses: rojo-rbx/setup-rojo@v1
        with:
          version: "7.4.4"

      - name: Build NeonSlice.rbxlx
        run: rojo build default.project.json -o NeonSlice.rbxlx

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonSlice
          path: NeonSlice.rbxlx

      - name: Commit NeonSlice.rbxlx to repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add NeonSlice.rbxlx
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update pre-built NeonSlice.rbxlx [skip ci]" && git push

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: NeonSlice

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NeonSlice.rbxlx
          generate_release_notes: true
