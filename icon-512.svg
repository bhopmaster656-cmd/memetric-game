<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0020"/>
      <stop offset="100%" stop-color="#1a003a"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff00ff"/>
      <stop offset="50%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#ffff00"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Grid lines -->
  <line x1="256" y1="340" x2="0" y2="512" stroke="#ff00ff" stroke-width="1.5" opacity="0.25"/>
  <line x1="256" y1="340" x2="128" y2="512" stroke="#ff00ff" stroke-width="1.5" opacity="0.25"/>
  <line x1="256" y1="340" x2="256" y2="512" stroke="#ff00ff" stroke-width="1.5" opacity="0.25"/>
  <line x1="256" y1="340" x2="384" y2="512" stroke="#ff00ff" stroke-width="1.5" opacity="0.25"/>
  <line x1="256" y1="340" x2="512" y2="512" stroke="#ff00ff" stroke-width="1.5" opacity="0.25"/>
  <line x1="0" y1="410" x2="512" y2="410" stroke="#ff00ff" stroke-width="1.5" opacity="0.2"/>
  <line x1="0" y1="460" x2="512" y2="460" stroke="#ff00ff" stroke-width="1.5" opacity="0.2"/>
  <!-- Neon ground line -->
  <line x1="0" y1="345" x2="512" y2="345" stroke="#ff00ff" stroke-width="3"/>
  <line x1="0" y1="345" x2="512" y2="345" stroke="#ff00ff" stroke-width="10" opacity="0.2"/>
  <!-- Main emoji character -->
  <text x="256" y="290" text-anchor="middle" font-size="140" font-family="serif">😎</text>
  <!-- MEMETRIC text -->
  <text x="256" y="430" text-anchor="middle"
        font-family="'Arial Black', Impact, sans-serif"
        font-weight="900" font-size="68" letter-spacing="6"
        fill="url(#text-grad)">MEMETRIC</text>
  <!-- Subtitle -->
  <text x="256" y="472" text-anchor="middle"
        font-family="'Arial', sans-serif"
        font-size="24" letter-spacing="4"
        fill="#aaaaaa" opacity="0.8">RHYTHM PLATFORMER</text>
  <!-- Stars -->
  <circle cx="60" cy="60" r="3" fill="white" opacity="0.7"/>
  <circle cx="120" cy="40" r="2" fill="white" opacity="0.5"/>
  <circle cx="200" cy="80" r="2.5" fill="white" opacity="0.6"/>
  <circle cx="320" cy="50" r="2" fill="white" opacity="0.5"/>
  <circle cx="440" cy="70" r="3" fill="white" opacity="0.7"/>
  <circle cx="480" cy="120" r="2" fill="white" opacity="0.4"/>
  <circle cx="40" cy="150" r="2" fill="white" opacity="0.5"/>
</svg>
